name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  TARGET: aarch64-unknown-linux-gnu

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --verbose

      - name: postinst restart (stub systemctl)
        run: |
          chmod +x packaging/test-postinst-restart.sh packaging/debian/postinst
          packaging/test-postinst-restart.sh

  release-arm64:
    name: cross-build, deb, artifacts
    runs-on: ubuntu-latest
    container: debian:trixie
    needs: check
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git gcc-aarch64-linux-gnu \
            libc6-dev-arm64-cross \
            binutils binutils-aarch64-linux-gnu dpkg-dev xz-utils

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: SOURCE_DATE_EPOCH from commit
        id: epoch
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          EPOCH="$(git log -1 --format=%ct)"
          echo "SOURCE_DATE_EPOCH=${EPOCH}" >> "$GITHUB_ENV"
          echo "epoch=${EPOCH}" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ env.TARGET }}-trixie

      - name: Add Rust target
        run: rustup target add ${{ env.TARGET }}

      - name: cargo build --release
        run: cargo build --release --target ${{ env.TARGET }}

      - name: Verify GLIBC symbol versions
        id: glibc
        run: |
          BIN="target/${{ env.TARGET }}/release/cardputer-zero-hid"
          GADGET_BIN="target/${{ env.TARGET }}/release/cardputer-zero-hid-gadget"
          chmod +x packaging/glibc-required-version.sh packaging/verify-glibc-max.sh
          REQUIRED="$(packaging/glibc-required-version.sh "$BIN")"
          GADGET_GLIBC="$(packaging/glibc-required-version.sh "$GADGET_BIN")"
          packaging/verify-glibc-max.sh "$BIN" 2.41
          packaging/verify-glibc-max.sh "$GADGET_BIN" 2.41
          chmod +x packaging/glibc-symbols-report.sh
          echo "=== cardputer-zero-hid: GLIBC_2.35+ symbols ==="
          MAIN_GLIBC_35="$(packaging/glibc-symbols-report.sh "$BIN")"
          echo "$MAIN_GLIBC_35"
          echo "=== cardputer-zero-hid-gadget: GLIBC_2.35+ symbols ==="
          GADGET_GLIBC_35="$(packaging/glibc-symbols-report.sh "$GADGET_BIN")"
          echo "$GADGET_GLIBC_35"
          GADGET_GLIBC_35_ONELINE="$(printf '%s\n' "$GADGET_GLIBC_35" | paste -sd ', ' -)"
          {
            echo "gadget_glibc_35_symbols<<EOF"
            printf '%s\n' "$GADGET_GLIBC_35_ONELINE"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          MAX="$(printf '%s\n%s\n' "$REQUIRED" "$GADGET_GLIBC" | sort -t. -k1,1n -k2,2n -V | tail -1)"
          echo "required_glibc=$MAX" >> "$GITHUB_OUTPUT"
          echo "main_glibc=$REQUIRED" >> "$GITHUB_OUTPUT"
          echo "gadget_glibc=$GADGET_GLIBC" >> "$GITHUB_OUTPUT"
          MAIN_SHA=$(sha256sum "$BIN" | awk '{print $1}')
          GADGET_SHA=$(sha256sum "$GADGET_BIN" | awk '{print $1}')
          echo "main_sha256=$MAIN_SHA" >> "$GITHUB_OUTPUT"
          echo "gadget_sha256=$GADGET_SHA" >> "$GITHUB_OUTPUT"
          echo "Binary sha256: cardputer-zero-hid=$MAIN_SHA"
          echo "Binary sha256: cardputer-zero-hid-gadget=$GADGET_SHA"

      - name: Build .deb (first)
        env:
          SOURCE_DATE_EPOCH: ${{ steps.epoch.outputs.epoch }}
        run: |
          chmod +x packaging/build-deb.sh
          packaging/build-deb.sh target/${{ env.TARGET }}/release/cardputer-zero-hid
          PKG="$(ls -1 dist/Cardputer\ Zero\ HID_*.deb)"
          cp -f "$PKG" dist/build-first.deb
          rm -f "$PKG"

      - name: Build .deb (second, reproducibility)
        id: repro
        env:
          SOURCE_DATE_EPOCH: ${{ steps.epoch.outputs.epoch }}
        run: |
          packaging/build-deb.sh target/${{ env.TARGET }}/release/cardputer-zero-hid
          PKG="$(ls -1 dist/Cardputer\ Zero\ HID_*.deb)"
          cp -f "$PKG" dist/build-second.deb
          rm -f "$PKG"
          SHA1=$(sha256sum dist/build-first.deb | awk '{print $1}')
          SHA2=$(sha256sum dist/build-second.deb | awk '{print $1}')
          echo "deb_sha256_first=$SHA1" >> "$GITHUB_ENV"
          echo "deb_sha256_second=$SHA2" >> "$GITHUB_ENV"
          echo "deb_sha256_first=$SHA1" >> "$GITHUB_OUTPUT"
          echo "deb_sha256_second=$SHA2" >> "$GITHUB_OUTPUT"
          if [ "$SHA1" != "$SHA2" ]; then
            echo "error: .deb bytes differ between two builds on the same commit" >&2
            exit 1
          fi
          echo "Reproducible .deb: sha256 match ($SHA1)"

      - name: Collect artifact sizes
        id: sizes
        run: |
          BIN="target/${{ env.TARGET }}/release/cardputer-zero-hid"
          GADGET_BIN="target/${{ env.TARGET }}/release/cardputer-zero-hid-gadget"
          DEB="dist/build-second.deb"
          BIN_BYTES=$(stat -c%s "$BIN")
          GADGET_BIN_BYTES=$(stat -c%s "$GADGET_BIN")
          DEB_BYTES=$(stat -c%s "$DEB")
          LIBC_DEPENDS=$(dpkg-deb -f "$DEB" Depends)
          sha256sum "$BIN" | awk '{print $1}' > dist/main-binary.sha256
          sha256sum "$GADGET_BIN" | awk '{print $1}' > dist/gadget-binary.sha256
          echo "bin_bytes=$BIN_BYTES" >> "$GITHUB_OUTPUT"
          echo "gadget_bin_bytes=$GADGET_BIN_BYTES" >> "$GITHUB_OUTPUT"
          echo "deb_bytes=$DEB_BYTES" >> "$GITHUB_OUTPUT"
          echo "deb_path=$DEB" >> "$GITHUB_OUTPUT"
          echo "libc_depends=$LIBC_DEPENDS" >> "$GITHUB_OUTPUT"

      - name: Job summary
        run: |
          {
            echo "## Cardputer Zero HID (M0) build"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Highest GLIBC symbol (main) | **${{ steps.glibc.outputs.main_glibc }}** |"
            echo "| Highest GLIBC symbol (gadget) | **${{ steps.glibc.outputs.gadget_glibc }}** |"
            echo "| GLIBC_2.35+ symbols (gadget) | \`${{ steps.glibc.outputs.gadget_glibc_35_symbols }}\` |"
            echo "| Package \`Depends\` (max of both) | **${{ steps.glibc.outputs.required_glibc }}** (max 2.41) |"
            echo "| \`Depends\` field | \`${{ steps.sizes.outputs.libc_depends }}\` |"
            echo "| Stripped \`cardputer-zero-hid\` (bytes) | ${{ steps.sizes.outputs.bin_bytes }} |"
            echo "| Stripped \`cardputer-zero-hid-gadget\` (bytes) | ${{ steps.sizes.outputs.gadget_bin_bytes }} |"
            echo "| \`cardputer-zero-hid\` sha256 | \`${{ steps.glibc.outputs.main_sha256 }}\` |"
            echo "| \`cardputer-zero-hid-gadget\` sha256 | \`${{ steps.glibc.outputs.gadget_sha256 }}\` |"
            echo "| .deb (bytes) | ${{ steps.sizes.outputs.deb_bytes }} |"
            echo "| .deb sha256 (build 1) | \`${{ steps.repro.outputs.deb_sha256_first }}\` |"
            echo "| .deb sha256 (build 2) | \`${{ steps.repro.outputs.deb_sha256_second }}\` |"
            echo "| Reproducible | match |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release binaries
        uses: actions/upload-artifact@v4
        with:
          name: cardputer-zero-hid-aarch64-release
          path: |
            target/${{ env.TARGET }}/release/cardputer-zero-hid
            target/${{ env.TARGET }}/release/cardputer-zero-hid-gadget
            dist/main-binary.sha256
            dist/gadget-binary.sha256

      - name: Upload deb package
        uses: actions/upload-artifact@v4
        with:
          name: cardputer-zero-hid-deb
          path: dist/build-second.deb